version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: codeguide-starter-fullstack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-arsip_app}
      MYSQL_USER: ${DB_USER:-arsip_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-arsip_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - codeguide-starter-fullstack-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeguide-starter-fullstack-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-arsip_user}
      - DB_PASSWORD=${DB_PASSWORD:-arsip_password}
      - DB_NAME=${DB_NAME:-arsip_app}
      - DATABASE_URL=mysql://${DB_USER:-arsip_user}:${DB_PASSWORD:-arsip_password}@mysql:3306/${DB_NAME:-arsip_app}
      - BETTER_AUTH_SECRET=your-super-secret-key-change-in-production
      - BETTER_AUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - codeguide-starter-fullstack-network

  # Development database only
  mysql-dev:
    image: mysql:8.0
    container_name: codeguide-starter-fullstack-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-arsip_app}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - codeguide-starter-fullstack-network
    profiles:
      - dev

volumes:
  mysql_data:
    driver: local
  mysql_dev_data:
    driver: local

networks:
  codeguide-starter-fullstack-network:
    driver: bridge